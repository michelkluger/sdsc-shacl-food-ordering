[project]
name = "food-api"
version = "0.1.0"
description = "SHACL-driven food ordering API: JSON-LD + SHACL are the single source of truth for forms and validation."
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Michel Kluger" }]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.13.0",
    "rdflib==7.6.0",
    "pyshacl==0.40.1",
    "meilisearch-python-sdk==7.5.2",
    "typer==0.20.0",
]

[project.scripts]
food-api = "food_api.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "ruff==0.16.6",
    "ty==0.0.78",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/food_api"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "PL",   # pylint
    "TRY",  # tryceratops
    "RUF",  # ruff-specific
]
ignore = [
    "ANN401",  # allow `Any` where the JSON boundary genuinely is `Any`
    "TRY003",  # long messages inline: our errors are user-facing and worth spelling out
]

[tool.ruff.lint.per-file-ignores]
# S101: assert IS the point of a test.
# S105/S106: bandit flags any argument named `token`; ours is a vocabulary option token.
# ANN001/ANN201: test functions and their fixtures are self-describing.
# PLR2004: an expected value inline in an assertion is clearer than a named constant.
"tests/**" = ["S101", "S105", "S106", "ANN001", "ANN201", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

# ---------------------------------------------------------------- ty

[tool.ty.environment]
python-version = "3.13"
# `.` as well as `./src` so the test package's own `tests.conftest` imports resolve.
root = ["./src", "."]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "integration: requires a live Meilisearch instance (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    # Warnings are errors: a DeprecationWarning raised inside rdflib's JSON-LD parser would
    # otherwise surface in production as an unexplained "payload could not be read".
    "error",
    # rdflib 7.6 still builds a ConjunctiveGraph internally when parsing JSON-LD and warns
    # about its own deprecation. Nothing here constructs one; remove when rdflib stops.
    "ignore:ConjunctiveGraph is deprecated:DeprecationWarning",
    "ignore::DeprecationWarning:pyshacl.*",
]

[tool.coverage.run]
source = ["food_api"]
branch = true
omit = ["*/cli.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
]
