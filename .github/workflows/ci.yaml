name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.8.3"
  BUN_VERSION: "1.3.5"

jobs:
  backend-lint:
    name: Backend lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: ruff format --check
        working-directory: backend
        run: uv run ruff format --check src tests

      - name: ruff check
        working-directory: backend
        run: uv run ruff check --output-format=github src tests

      - name: ty check
        working-directory: backend
        run: uv run ty check

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest

    # A real Meilisearch, so the integration tests actually run rather than skipping. Locally
    # they are opt-in; here they are the point - the in-memory fake cannot tell us whether the
    # index settings or the filter syntax are right.
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.53.1
        env:
          MEILI_MASTER_KEY: ciMasterKey
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl --fail --silent http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      FOOD_API_MEILI_URL: http://localhost:7700
      FOOD_API_MEILI_MASTER_KEY: ciMasterKey

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Validate the dish corpus
        working-directory: backend
        run: uv run food-api check

      - name: Run tests
        working-directory: backend
        run: uv run pytest --cov=food_api --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Confirm the integration tests were not silently skipped
        working-directory: backend
        run: uv run pytest -m integration --collect-only -q | tail -1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  stack-smoke-test:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      # The seed service is one-shot. Without waiting for it the search assertion below races
      # against indexing and fails intermittently, which is worse than failing outright.
      - name: Wait for seeding to finish
        run: |
          docker compose wait seed
          docker compose logs --no-color seed

      - name: Wait for the API to report healthy
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8000/api/healthz > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 3
          done
          echo "API never became healthy." >&2
          docker compose logs --no-color
          exit 1

      # The claims in the README, checked against a running stack rather than a test double.
      - name: Every dish is served
        run: |
          curl --fail --silent http://localhost:8000/api/dishes \
            | tee /dev/stderr \
            | grep -q 'poke-bowl'

      - name: A form is generated from each dish's shape
        run: |
          for slug in french-tacos ramen poke-bowl; do
            curl --fail --silent "http://localhost:8000/api/dishes/$slug/form" \
              | grep -q '"uischema"' || { echo "no uischema for $slug" >&2; exit 1; }
          done

      # The fixture files are posted verbatim: their `description` and `expectedPointers`
      # keys are ignored by the request model, so a fixture is literally a valid request body.
      - name: A valid order is accepted
        run: |
          curl --fail --silent -X POST http://localhost:8000/api/orders/ramen \
            -H 'content-type: application/json' \
            -d @backend/tests/fixtures/orders/ramen/valid.json \
            | grep -q '"accepted":true'

      - name: An invalid order is rejected with pointered violations
        run: |
          status=$(curl --silent --output /tmp/problem.json --write-out '%{http_code}' \
            -X POST http://localhost:8000/api/orders/ramen \
            -H 'content-type: application/json' \
            -d '{"data":{"broth":"veganMiso","noodleFirmness":"firm","spiceLevel":9,"toppings":["chashu"],"quantity":1,"customerName":"CI"}}')
          cat /tmp/problem.json
          test "$status" = "422" || { echo "expected 422, got $status" >&2; exit 1; }
          grep -q '"/toppings/0"' /tmp/problem.json
          grep -q '"/spiceLevel"' /tmp/problem.json

      - name: Every dish is served in every supported language
        run: |
          for lang in en de fr it rm; do
            for slug in french-tacos ramen poke-bowl; do
              curl --fail --silent "http://localhost:8000/api/dishes/$slug/form?lang=$lang"                 | grep -q "\"language\":\"$lang\""                 || { echo "no $lang form for $slug" >&2; exit 1; }
            done
          done

      - name: Violation messages are translated
        run: |
          curl --silent -X POST 'http://localhost:8000/api/orders/ramen?lang=de'             -H 'content-type: application/json'             -d '{"data":{"broth":"veganMiso","noodleFirmness":"firm","spiceLevel":9,"toppings":["chashu"],"quantity":1,"customerName":"CI"}}'             > /tmp/de.json
          cat /tmp/de.json
          grep -q 'Schärfe' /tmp/de.json
          grep -q 'veganen Brühe' /tmp/de.json

      - name: Search returns indexed dishes
        run: |
          curl --fail --silent 'http://localhost:8000/api/search?q=poke' \
            | tee /dev/stderr \
            | grep -q 'poke-bowl'

      - name: The frontend is served and proxies the API
        run: |
          curl --fail --silent --output /dev/null http://localhost:5173/
          curl --fail --silent http://localhost:5173/api/dishes | grep -q 'ramen'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes
