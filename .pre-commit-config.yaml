# Optional but recommended: `uvx pre-commit install`.
#
# These are the fast checks only. Type checking and the test suite stay in ./scripts/check.sh
# and in CI, where a slow check is acceptable and a skipped one is not.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-format
        files: ^backend/
      - id: ruff-check
        args: [--fix]
        files: ^backend/
