server {
    listen 80;
    # Dual-stack. Without this, `localhost` inside the container resolves to ::1 first and
    # nothing is listening there, so anything probing "localhost" gets connection refused
    # while the service is in fact perfectly healthy.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the API. This is why the bundle uses relative URLs and why CORS
    # never applies to the containerised stack.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed asset filenames, so they can be cached indefinitely. index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
